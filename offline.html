<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b35b5">
  <title>Офлайн — Сартарошхонаҳо</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5fb;color:#211b31;font-family:system-ui,sans-serif;text-align:center}
    main{max-width:440px;padding:32px;background:#fff;border:1px solid #e9e4f1;border-radius:22px}
    h1{color:#5b35b5;font-size:25px}p{line-height:1.6;color:#716b7e}
    button{border:0;border-radius:10px;padding:12px 18px;background:#5b35b5;color:#fff;font:inherit;font-weight:600}
  </style>
</head>
<body>
  <main>
    <h1>Шумо ҳоло офлайн ҳастед</h1>
    <p>Пайвасти интернет дастрас нест. Барои дидани маълумоти нав ва гирифтани навбат интернетро фаъол карда, саҳифаро нав кунед.</p>
    <button onclick="location.reload()">Аз нав кӯшиш кардан</button>
  </main>
</body>
</html>
