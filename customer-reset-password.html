<!doctype html>
<html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b52"><title>Барқарор кардани ҳисоби муштарӣ</title>
<style>body{margin:0;padding:20px;background:#f1f8f4;color:#18352d;font-family:system-ui,sans-serif}main{max-width:460px;margin:8vh auto;padding:24px;background:#fff;border:1px solid #d8e9df;border-radius:18px}h1{color:#176b52;font-size:24px}p{line-height:1.6;color:#526b62}label{display:block;margin:14px 0 6px;font-weight:650}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #cfe4d7;border-radius:10px;font:inherit}button{width:100%;padding:12px;margin-top:16px;background:#176b52;color:white;border:0;border-radius:10px;font:inherit;font-weight:700}#status{margin-top:14px;padding:12px;background:#f1f8f4;border-radius:10px;line-height:1.5}a{color:#176b52}</style></head>
<body><main><h1>Пароли нав</h1><p>Пайванди почтаи электрониро кушодаӣ. Пароли нави на камтар аз 12 аломатро ворид кун.</p>
<form id="form" hidden><label for="p1">Пароли нав</label><input id="p1" type="password" minlength="12" autocomplete="new-password" required><label for="p2">Паролро такрор кун</label><input id="p2" type="password" minlength="12" autocomplete="new-password" required><button id="save">Сабт кардани парол</button></form>
<div id="status" role="status">Пайванди барқарорсозӣ санҷида мешавад…</div><p><a href="./">Бозгашт ба сомона</a></p></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.119.0";
const supabase=createClient("https://yjybilaaxqtzhlvaabwd.supabase.co","sb_publishable_yyeO2kZv9yRQyLUOl7fG6Q_j_7ixPc1",{auth:{storageKey:"barber-booking-customer-auth",autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
const form=document.getElementById("form"),status=document.getElementById("status"),save=document.getElementById("save");let ready=false;
supabase.auth.onAuthStateChange(event=>{if(event==="PASSWORD_RECOVERY"){ready=true;form.hidden=false;status.textContent="Пайванд тасдиқ шуд. Пароли навро ворид кун.";}});
form.addEventListener("submit",async ev=>{ev.preventDefault();if(!ready){status.textContent="Пайванди барқарорсозӣ тасдиқ нашудааст. Аз нав дархост кун.";return;}const p1=document.getElementById("p1").value,p2=document.getElementById("p2").value;if(p1.length<12){status.textContent="Парол бояд на камтар аз 12 аломат дошта бошад.";return;}if(p1!==p2){status.textContent="Паролҳо якхела нестанд.";return;}save.disabled=true;const {error}=await supabase.auth.updateUser({password:p1});if(error){status.textContent="Парол иваз нашуд: "+error.message;save.disabled=false;return;}form.hidden=true;status.textContent="Парол иваз шуд. Акнун ба саҳифаи ҳисоби муштарӣ баргашта, бо почта ва пароли нав ворид шав.";await supabase.auth.signOut();});
</script></body></html>
