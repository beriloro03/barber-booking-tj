<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b35b5">
  <title>Иваз кардани парол — Сартарошхонаҳо</title>
  <style>
    :root{--p:#5b35b5;--ink:#211b31;--muted:#716b7e;--bg:#f7f5fb;--line:#e9e4f1}
    *{box-sizing:border-box}
    body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:480px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
    h1{font-size:24px;margin:0 0 8px;color:var(--p)}
    p{color:var(--muted);line-height:1.55}
    label{display:block;font-weight:650;margin:16px 0 6px}
    input{width:100%;font:inherit;padding:12px;border:1px solid #d9d2e5;border-radius:10px}
    button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--p);color:#fff;font:inherit;font-weight:700}
    button:disabled{opacity:.55}
    #status{padding:12px;border-radius:10px;background:#f1edfa;color:var(--muted);margin-top:16px;overflow-wrap:anywhere}
    .hidden{display:none}
    a{color:var(--p)}
  </style>
</head>
<body>
  <main>
    <h1>Иваз кардани парол</h1>
    <p>Барои ҳисоби худ пароли нав интихоб кун. Парол бояд на камтар аз 12 аломат бошад.</p>
    <form id="resetForm" class="hidden">
      <label for="newPassword">Пароли нав</label>
      <input id="newPassword" type="password" minlength="12" autocomplete="new-password" required>
      <label for="confirmPassword">Паролро такрор кун</label>
      <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
      <button id="saveButton" type="submit">Сабт кардани пароли нав</button>
    </form>
    <div id="status" role="status">Пайванди барқарорсозиро месанҷем. Лутфан интизор шав...</div>
    <p><a href="./">Бозгашт ба сомона</a></p>
  </main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.119.0";

    const supabase = createClient(
      "https://yjybilaaxqtzhlvaabwd.supabase.co",
      "sb_publishable_yyeO2kZv9yRQyLUOl7fG6Q_j_7ixPc1"
    );

    const form = document.getElementById("resetForm");
    const statusBox = document.getElementById("status");
    const saveButton = document.getElementById("saveButton");
    let recoveryReady = false;

    function showStatus(message) {
      statusBox.textContent = message;
    }

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        form.classList.remove("hidden");
        showStatus("Пайванд тасдиқ шуд. Акнун пароли навро ворид кун.");
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!recoveryReady) {
        showStatus("Пайванди барқарорсозӣ тасдиқ нашудааст. Аз Gmail пайванди навро кушо.");
        return;
      }

      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 12) {
        showStatus("Парол бояд на камтар аз 12 аломат дошта бошад.");
        return;
      }
      if (password !== confirmation) {
        showStatus("Ду парол якхела нестанд. Бори дигар санҷ.");
        return;
      }

      saveButton.disabled = true;
      showStatus("Пароли нав сабт шуда истодааст...");
      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        showStatus("Парол сабт нашуд: " + error.message);
        saveButton.disabled = false;
        return;
      }

      form.classList.add("hidden");
      showStatus("Парол бомуваффақият иваз шуд. Акнун метавонӣ ба панели соҳибкор ворид шавӣ.");
      await supabase.auth.signOut();
    });
  </script>
</body>
</html>
